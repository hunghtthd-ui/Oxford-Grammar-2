<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Grammar & Vocabulary Practice</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap');
    body {
      font-family: 'Nunito', sans-serif;
    }
    h1, h2, h3, .font-heading {
      font-family: 'Fredoka', sans-serif;
    }
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .pop-in {
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="bg-amber-50 min-h-screen text-slate-800 flex flex-col justify-between">

  <!-- Navigation Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-graduation-cap text-3xl text-yellow-300"></i>
        <h1 class="text-xl sm:text-2xl font-bold tracking-wide">English Practice Hub</h1>
      </div>
      <button id="restartBtn" onclick="initApp()" class="bg-indigo-500 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl shadow transition transform active:scale-95 flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i>
        <span class="hidden sm:inline">Restart Practice</span>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow flex flex-col justify-center">

    <!-- Start / Mode Selection Screen -->
    <div id="welcomeScreen" class="bg-white rounded-3xl p-6 sm:p-10 shadow-xl text-center border-4 border-indigo-100 pop-in">
      <div class="text-6xl mb-4 text-indigo-500">
        <i class="fa-solid fa-star text-yellow-400 animate-bounce"></i>
      </div>
      <h2 class="text-2xl sm:text-3xl font-extrabold text-indigo-900 mb-4">Welcome to English Quiz!</h2>
      <p class="text-gray-600 mb-8 text-base sm:text-lg">Select a part to start practicing or take the full test.</p>
      
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <button onclick="startPart(1)" class="bg-emerald-500 hover:bg-emerald-600 text-white p-6 rounded-2xl shadow-lg font-bold text-lg transition transform hover:-translate-y-1 active:translate-y-0 flex flex-col items-center gap-2 border-b-4 border-emerald-700">
          <i class="fa-solid fa-cubes text-3xl"></i>
          <span>Part 1: Countable vs Uncountable</span>
        </button>
        <button onclick="startPart(2)" class="bg-violet-500 hover:bg-violet-600 text-white p-6 rounded-2xl shadow-lg font-bold text-lg transition transform hover:-translate-y-1 active:translate-y-0 flex flex-col items-center gap-2 border-b-4 border-violet-700">
          <i class="fa-solid fa-font text-3xl"></i>
          <span>Part 2: Articles (a / an / -)</span>
        </button>
      </div>
    </div>

    <!-- Active Quiz Card -->
    <div id="quizScreen" class="hidden bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-4 border-indigo-100 relative pop-in">
      <!-- Top Bar: Progress & Counter -->
      <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
        <span id="partTitle" class="font-bold text-indigo-600 text-lg uppercase tracking-wider">Part 1</span>
        <div class="flex items-center space-x-2">
          <span class="text-sm font-semibold text-gray-500">Question</span>
          <span id="questionProgress" class="bg-indigo-100 text-indigo-800 font-extrabold px-3 py-1 rounded-full text-sm">1 / 13</span>
        </div>
      </div>

      <!-- Image Display Container (Responsive & Fitted) -->
      <div class="w-full h-56 sm:h-64 bg-slate-100 rounded-2xl mb-6 overflow-hidden flex items-center justify-center relative border border-slate-200">
        <img id="questionImage" src="" alt="Vocabulary Image" class="w-full h-full object-contain p-2 transition-all duration-300" onerror="handleImageError()">
        <div id="fallbackEmoji" class="hidden text-8xl flex items-center justify-center w-full h-full select-none">✏️</div>
      </div>

      <!-- Question Text & Audio Button -->
      <div class="flex items-center justify-center gap-3 mb-6">
        <h3 id="questionText" class="text-2xl sm:text-3xl font-extrabold text-slate-800 text-center">
          <!-- Populated dynamically -->
        </h3>
        <button onclick="speakCurrentText()" title="Listen Word" class="bg-yellow-400 hover:bg-yellow-500 text-amber-950 p-3 rounded-full shadow-md transition transform active:scale-95 flex items-center justify-center">
          <i class="fa-solid fa-volume-high text-xl"></i>
        </button>
      </div>

      <!-- Options Container -->
      <div id="optionsContainer" class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
        <!-- Buttons added by JavaScript -->
      </div>

      <!-- Error & Warning Messages -->
      <div id="attemptsIndicator" class="text-center text-sm font-bold text-rose-500 min-h-[24px] mb-4">
        <!-- Tối đa 3 lần thử -->
      </div>

      <!-- Action Footer Button -->
      <div class="flex justify-center">
        <button id="checkBtn" onclick="checkAnswer()" class="w-full sm:w-2/3 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 sm:py-4 px-6 rounded-2xl text-lg shadow-lg border-b-4 border-indigo-800 transition transform active:translate-y-1">
          Check Answer
        </button>
        <button id="nextBtn" onclick="nextQuestion()" class="hidden w-full sm:w-2/3 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold py-3 sm:py-4 px-6 rounded-2xl text-lg shadow-lg border-b-4 border-emerald-700 transition transform active:translate-y-1">
          Next Question <i class="fa-solid fa-arrow-right ml-2"></i>
        </button>
      </div>

      <!-- Feedback Overlay Banner -->
      <div id="feedbackBanner" class="hidden mt-4 p-4 rounded-xl text-center font-extrabold text-lg pop-in"></div>
    </div>

    <!-- Final Score Results Screen -->
    <div id="resultScreen" class="hidden bg-white rounded-3xl p-6 sm:p-10 shadow-xl text-center border-4 border-indigo-100 pop-in">
      <div class="text-7xl mb-4 text-yellow-400">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h2 class="text-3xl font-extrabold text-indigo-900 mb-2">Great Job!</h2>
      <p class="text-gray-600 mb-6">You have completed the exercise!</p>

      <!-- Stats Grid -->
      <div class="grid grid-cols-2 gap-4 max-w-sm mx-auto mb-8">
        <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-200">
          <span class="block text-3xl font-extrabold text-emerald-600" id="correctCount">0</span>
          <span class="text-sm font-bold text-emerald-800">Correct</span>
        </div>
        <div class="bg-rose-50 p-4 rounded-2xl border border-rose-200">
          <span class="block text-3xl font-extrabold text-rose-600" id="wrongCount">0</span>
          <span class="text-sm font-bold text-rose-800">Incorrect</span>
        </div>
      </div>

      <button onclick="initApp()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-3 px-8 rounded-2xl text-lg shadow-lg border-b-4 border-indigo-800 transition transform active:translate-y-1">
        Try Again
      </button>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-4 text-xs text-gray-400">
    Interactive English Learning Tool • Optimized for Mobile & Desktop
  </footer>

  <!-- JavaScript Logic Section -->
  <script>
    // ==========================================
    // DATA DEFINITION FOR QUESTIONS
    // ==========================================
    
    // Part 1: Countable vs Uncountable
    const part1Questions = [
      { id: 'hair', word: 'hair', answer: 'uncountable', emoji: '💇‍♀️', image: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&auto=format&fit=crop' },
      { id: 'bread', word: 'bread', answer: 'uncountable', emoji: '🍞', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQOkimwvJGL8L4l9StOQD15yr6zrA0r5M7y1HBQRQ09jq4HMqra1ZQKldo&s=10?w=600&auto=format&fit=crop' },
      { id: 'music', word: 'music', answer: 'uncountable', emoji: '🎵', image: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop' },
      { id: 'homework', word: 'homework', answer: 'uncountable', emoji: '📚', image: 'https://cdn.langeek.co/photo/49183/original/homework?type=jpeg?w=600&auto=format&fit=crop' },
      { id: 'pasta', word: 'pasta', answer: 'uncountable', emoji: '🍝', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSClppg-lgWvShLhZEjAH84kCfJ5BxQmEcqLqiEJhJdzw&s=10?w=600&auto=format&fit=crop' },
      { id: 'honey', word: 'honey', answer: 'uncountable', emoji: '🍯', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfTCyK-zhNtLTywkFzmLnE-7eMXM9pkTyHUtRQZwB3ZA&s=10?w=600&auto=format&fit=crop' },
      { id: 'pants', word: 'pants', answer: 'countable', emoji: '👖', image: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=600&auto=format&fit=crop' },
      { id: 'hat', word: 'hat', answer: 'countable', emoji: '🎩', image: 'https://images.unsplash.com/photo-1534215754734-18e55d13e346?w=600&auto=format&fit=crop' },
      { id: 'socks', word: 'socks', answer: 'countable', emoji: '🧦', image: 'https://images.unsplash.com/photo-1586350977771-b3b0abd50c82?w=600&auto=format&fit=crop' },
      { id: 'shoes', word: 'shoes', answer: 'countable', emoji: '👟', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop' },
      { id: 'sweater', word: 'sweater', answer: 'countable', emoji: '🧥', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRggVc1Alnvqp4_h8Cyk18S0xNU5ic-ov7SIXhg0Bph7Iij4gWyqkpqz6g&s=10?w=600&auto=format&fit=crop' },
      { id: 'shorts', word: 'shorts', answer: 'countable', emoji: '🩳', image: 'https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=600&auto=format&fit=crop' },
      { id: 'coat', word: 'coat', answer: 'countable', emoji: '🧥', image: 'https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=600&auto=format&fit=crop' }
    ];

    // Part 2: Articles (a, an, -)
    const part2Questions = [
      { id: 'a_hair', displayWord: '_____ hair', speakWord: 'hair', answer: '-', emoji: '💇‍♀️', image: 'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?w=600&auto=format&fit=crop' },
      { id: 'a_homework', displayWord: '_____ homework', speakWord: 'homework', answer: '-', emoji: '📚', image: 'https://cdn.langeek.co/photo/49183/original/homework?type=jpeg?w=600&auto=format&fit=crop' },
      { id: 'a_pasta', displayWord: '_____ pasta', speakWord: 'pasta', answer: '-', emoji: '🍝', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSClppg-lgWvShLhZEjAH84kCfJ5BxQmEcqLqiEJhJdzw&s=10?w=600&auto=format&fit=crop' },
      { id: 'a_milk', displayWord: '_____ milk', speakWord: 'milk', answer: '-', emoji: '🥛', image: 'https://images.unsplash.com/photo-1563636619-e9143da7973b?w=600&auto=format&fit=crop' },
      { id: 'a_tomato', displayWord: '_____ tomato', speakWord: 'tomato', answer: 'a', emoji: '🍅', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzlx6YfMapwzsXgkRRffTjxyMashhxIoHD-dpH8zF_RGgFO2EE1aTKO9W4&s=10?w=600&auto=format&fit=crop' },
      { id: 'a_potato', displayWord: '_____ potato', speakWord: 'potato', answer: 'a', emoji: '🥔', image: 'https://www.alimentarium.org/sites/default/files/media/image/2017-02/AL027-01_pomme_de_terre_0_0.jpg?w=600&auto=format&fit=crop' },
      { id: 'a_red_apple', displayWord: '_____ red apple', speakWord: 'red apple', answer: 'a', emoji: '🍎', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSINcwQ8vHawyCV8E3xxYdZdrW6asxCiddnmlhT4RKssQ&s=10?w=600&auto=format&fit=crop' },
      { id: 'a_purple_umbrella', displayWord: '_____ purple umbrella', speakWord: 'purple umbrella', answer: 'a', emoji: '☂️', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGaJycz3uv2CSfLPnsm5AncpkKrDNmrbVR5Kq_vvDkder32TUcHdJ-uB1U&s=10?w=600&auto=format&fit=crop' },
      { id: 'a_ant', displayWord: '_____ ant', speakWord: 'ant', answer: 'an', emoji: '🐜', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSubXwoB9f-sWwIanChYY_eozZkKuNmzalFLupJeFRDxDaaCRfwk87YmrHe&s=10?w=600&auto=format&fit=crop' },
      { id: 'a_orange_kangaroo', displayWord: '_____ orange kangaroo', speakWord: 'orange kangaroo', answer: 'an', emoji: '🦘', image: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDLQlrd1BYINg-4cOyh1phF8iEa8Gr255mSCbp3pMc9Q&s=10?w=600&auto=format&fit=crop' }
    ];

    const praises = ['Well done!', 'Good job!', 'Excellent!', 'Very good!'];

    // Global State Variables
    let currentPart = 1;
    let questionsList = [];
    let currentQuestionIndex = 0;
    let selectedAnswer = null;
    let wrongAttemptsCount = 0;
    let totalScore = { correct: 0, wrong: 0 };
    let synth = window.speechSynthesis;
    let femaleVoice = null;

    // Load available Web Speech Voices
    function loadVoices() {
      if (!synth) return;
      const voices = synth.getVoices();
      // Try to find an English female voice
      femaleVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Victoria') || v.name.includes('Zira') || v.name.includes('Google US English'))) || 
                    voices.find(v => v.lang.startsWith('en')) || null;
    }

    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Shuffle Array Utility (Fisher-Yates Algorithm)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Audio Synthesis Function
    function speakText(text) {
      if (!synth) return;
      synth.cancel(); // Stop any active speech
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.8; // Slow rate for clear listening
      utterance.pitch = 1.1; // Slightly higher pitch for female voice feel
      if (femaleVoice) {
        utterance.voice = femaleVoice;
      }
      synth.speak(utterance);
    }

    // Web Audio API Sound Effects (Simple Synths for Correct/Wrong)
    function playSoundEffect(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          // Happy chime
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'wrong') {
          // Buzz sound
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, ctx.currentTime);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        // Fallback silently if Web Audio is restricted
      }
    }

    // App Initialization
    function initApp() {
      loadVoices();
      document.getElementById('welcomeScreen').classList.remove('hidden');
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      totalScore = { correct: 0, wrong: 0 };
    }

    // Start a specific Part
    function startPart(partNum) {
      currentPart = partNum;
      currentQuestionIndex = 0;
      
      if (partNum === 1) {
        questionsList = shuffleArray(part1Questions);
      } else {
        questionsList = shuffleArray(part2Questions);
      }

      document.getElementById('welcomeScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');

      loadQuestion();
    }

    // Load and Render Current Question
    function loadQuestion() {
      selectedAnswer = null;
      wrongAttemptsCount = 0;

      const q = questionsList[currentQuestionIndex];

      // Update Header & Progress
      document.getElementById('partTitle').innerText = currentPart === 1 ? 'Part 1: Countable vs Uncountable' : 'Part 2: Articles (a / an / -)';
      document.getElementById('questionProgress').innerText = `${currentQuestionIndex + 1} / ${questionsList.length}`;
      
      // Clear Feedback & Messages
      document.getElementById('attemptsIndicator').innerText = '';
      const feedbackBanner = document.getElementById('feedbackBanner');
      feedbackBanner.classList.add('hidden');
      feedbackBanner.className = 'hidden mt-4 p-4 rounded-xl text-center font-extrabold text-lg pop-in';

      // Reset Button Visibility
      document.getElementById('checkBtn').classList.remove('hidden');
      document.getElementById('nextBtn').classList.add('hidden');

      // Display Image & Fallback Setup
      const imgElement = document.getElementById('questionImage');
      const emojiElement = document.getElementById('fallbackEmoji');
      imgElement.classList.remove('hidden');
      emojiElement.classList.add('hidden');
      emojiElement.innerText = q.emoji || '✏️';
      imgElement.src = q.image;

      // Display Question Text
      const qText = document.getElementById('questionText');
      qText.innerText = currentPart === 1 ? q.word : q.displayWord;

      // Render Answer Options
      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      const options = currentPart === 1 ? ['countable', 'uncountable'] : ['a', 'an', '-'];
      
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn bg-slate-100 hover:bg-indigo-50 text-indigo-900 border-2 border-slate-200 font-bold py-3 sm:py-4 px-4 rounded-2xl text-lg transition shadow-sm active:scale-95 flex justify-center items-center capitalize';
        btn.innerText = opt;
        btn.onclick = () => selectOption(opt, btn);
        optionsContainer.appendChild(btn);
      });

      // Auto TTS Speak Word on Question Load
      setTimeout(() => {
        speakCurrentText();
      }, 300);
    }

    // Image Error Handler (Switch to Emoji)
    function handleImageError() {
      document.getElementById('questionImage').classList.add('hidden');
      document.getElementById('fallbackEmoji').classList.remove('hidden');
    }

    // TTS Trigger for current question
    function speakCurrentText() {
      const q = questionsList[currentQuestionIndex];
      const textToSpeak = currentPart === 1 ? q.word : q.speakWord;
      speakText(textToSpeak);
    }

    // Select Option Action
    function selectOption(optValue, btnElement) {
      if (document.getElementById('nextBtn').classList.contains('hidden') === false) {
        return; // Question completed, prevent selection change
      }
      
      selectedAnswer = optValue;
      
      // Update Button Styles
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => {
        b.classList.remove('border-indigo-600', 'bg-indigo-100', 'text-indigo-800', 'shadow-md');
        b.classList.add('bg-slate-100', 'border-slate-200');
      });

      btnElement.classList.remove('bg-slate-100', 'border-slate-200');
      btnElement.classList.add('border-indigo-600', 'bg-indigo-100', 'text-indigo-800', 'shadow-md');
    }

    // Check Answer Logic
    function checkAnswer() {
      const feedbackBanner = document.getElementById('feedbackBanner');
      const attemptsIndicator = document.getElementById('attemptsIndicator');
      const q = questionsList[currentQuestionIndex];

      if (!selectedAnswer) {
        attemptsIndicator.innerText = 'Please select an answer first!';
        return;
      }

      if (selectedAnswer === q.answer) {
        // CORRECT ANSWER
        playSoundEffect('correct');
        totalScore.correct++;

        const randomPraise = praises[Math.floor(Math.random() * praises.length)];
        speakText(randomPraise);

        feedbackBanner.innerText = `🎉 ${randomPraise}`;
        feedbackBanner.className = 'mt-4 p-4 rounded-2xl text-center font-extrabold text-lg text-emerald-800 bg-emerald-100 border-2 border-emerald-300 pop-in';
        feedbackBanner.classList.remove('hidden');

        document.getElementById('checkBtn').classList.add('hidden');
        document.getElementById('nextBtn').classList.remove('hidden');

        // Highlight correct choice
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => {
          if (b.innerText.toLowerCase() === q.answer.toLowerCase()) {
            b.classList.className = '';
            b.className = 'option-btn bg-emerald-500 text-white font-bold py-3 sm:py-4 px-4 rounded-2xl text-lg shadow-md flex justify-center items-center capitalize';
          }
        });

      } else {
        // WRONG ANSWER
        wrongAttemptsCount++;
        playSoundEffect('wrong');

        const quizCard = document.getElementById('quizScreen');
        quizCard.classList.add('shake');
        setTimeout(() => quizCard.classList.remove('shake'), 500);

        if (wrongAttemptsCount >= 3) {
          // Failed 3 times - Reveal correct answer
          totalScore.wrong++;
          attemptsIndicator.innerText = '';

          feedbackBanner.innerText = `Incorrect! The correct answer is: "${q.answer}"`;
          feedbackBanner.className = 'mt-4 p-4 rounded-2xl text-center font-extrabold text-lg text-rose-800 bg-rose-100 border-2 border-rose-300 pop-in';
          feedbackBanner.classList.remove('hidden');

          document.getElementById('checkBtn').classList.add('hidden');
          document.getElementById('nextBtn').classList.remove('hidden');

          // Highlight correct answer and strike wrong selection
          const buttons = document.querySelectorAll('.option-btn');
          buttons.forEach(b => {
            if (b.innerText.toLowerCase() === q.answer.toLowerCase()) {
              b.className = 'option-btn bg-emerald-500 text-white font-bold py-3 sm:py-4 px-4 rounded-2xl text-lg shadow-md flex justify-center items-center capitalize';
            } else if (b.innerText.toLowerCase() === selectedAnswer.toLowerCase()) {
              b.className = 'option-btn bg-rose-500 text-white line-through font-bold py-3 sm:py-4 px-4 rounded-2xl text-lg shadow-md flex justify-center items-center capitalize';
            }
          });

        } else {
          // Less than 3 attempts -> Allow retry
          attemptsIndicator.innerText = `Incorrect! Try again. (${wrongAttemptsCount}/3 attempts)`;
          selectedAnswer = null;

          // Reset option selection styling
          const buttons = document.querySelectorAll('.option-btn');
          buttons.forEach(b => {
            b.classList.remove('border-indigo-600', 'bg-indigo-100', 'text-indigo-800', 'shadow-md');
            b.classList.add('bg-slate-100', 'border-slate-200');
          });
        }
      }
    }

    // Advance to Next Question or Next Part / Results
    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questionsList.length) {
        loadQuestion();
      } else {
        if (currentPart === 1) {
          // Switch to Part 2 automatically
          alert('Great! Now moving to Part 2: Articles (a / an / -)');
          startPart(2);
        } else {
          // Finish Quiz
          showResults();
        }
      }
    }

    // Display Final Score Screen
    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');

      document.getElementById('correctCount').innerText = totalScore.correct;
      document.getElementById('wrongCount').innerText = totalScore.wrong;

      speakText('Congratulations! You completed the test.');
    }

    // Global Keyboard Listener (Enter Key to Submit/Next)
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        const quizScreen = document.getElementById('quizScreen');
        if (!quizScreen.classList.contains('hidden')) {
          const checkBtn = document.getElementById('checkBtn');
          const nextBtn = document.getElementById('nextBtn');
          
          if (!checkBtn.classList.contains('hidden')) {
            checkAnswer();
          } else if (!nextBtn.classList.contains('hidden')) {
            nextQuestion();
          }
        }
      }
    });

    // Run Initialization on Load
    window.onload = function() {
      initApp();
    };
  </script>
</body>
</html>
